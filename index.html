  --azul: #004E96; --azul-medio: #3678BA; --marino: #00305A; --tinta: #0A2342;\r
  --amarillo: #FFD627; --verde: #2BB673; --rojo: #E5484D; --panel: #F1F4F9; --gris: #5B6B7F;\r
  --fuente: 'Montserrat', 'Segoe UI', system-ui, sans-serif;\r
}\r
* { box-sizing: border-box; }\r
#juego { position: fixed; inset: 0; font-family: var(--fuente); color: var(--tinta); user-select: none; -webkit-user-select: none; }\r
#juego canvas { display: block; }\r
button { font-family: var(--fuente); cursor: pointer; }\r
.oculto { display: none !important; }\r
\r
/* ---------- etiquetas 3D ---------- */\r
.capa-etiquetas { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 11; }   /* sobre el objetivo: son interactivas */\r
.etq3d { position: absolute; left: 0; top: 0; padding: 7px 14px; border-radius: 999px; background: #fff; color: var(--tinta);\r
  font-weight: 700; font-size: 14px; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,30,70,.3); }\r
.etq3d.clic { pointer-events: auto; cursor: pointer; border: 2px solid var(--amarillo); }\r
.etq3d.clic:hover { background: var(--amarillo); }\r
.etq3d.peligro { background: var(--rojo); color: #fff; }\r
.etq3d.info { background: var(--marino); color: #fff; }\r
.etq3d.ok { background: var(--verde); color: #fff; }\r
.destello { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .05s; z-index: 5; }\r
\r
/* ---------- HUD ---------- */\r
.hud-sup { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; gap: 12px; pointer-events: none; z-index: 10; }\r
.chip { background: rgba(0, 38, 74, .88); color: #fff; border-radius: 16px; padding: 10px 16px; backdrop-filter: blur(6px); box-shadow: 0 6px 20px rgba(0,0,0,.2); }\r
.jornada b { color: var(--amarillo); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; display: block; }\r
.jornada span { font-weight: 800; font-size: 17px; }\r
.jornada small { display: block; font-size: 12.5px; opacity: .85; margin-top: 2px; font-weight: 500; }\r
.indicadores { display: flex; gap: 10px; align-items: stretch; }\r
.ind { min-width: 120px; }\r
.ind label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--amarillo); text-transform: uppercase; }\r
.ind .v { font-weight: 900; font-size: 22px; font-variant-numeric: tabular-nums; }\r
.barra-seg { height: 8px; border-radius: 4px; background: rgba(255,255,255,.18); margin-top: 6px; overflow: hidden; }\r
.barra-seg i { display: block; height: 100%; width: 100%; background: var(--verde); transition: width .5s, background .5s; }\r
\r
.tareas { position: absolute; left: 14px; top: 104px; width: 280px; z-index: 10; background: rgba(255,255,255,.93); border-radius: 18px; padding: 14px 14px 10px;\r
  box-shadow: 0 10px 30px rgba(0,30,70,.2); }\r
.tareas h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: .14em; color: var(--azul); text-transform: uppercase; }\r
.tarea { display: flex; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; font-weight: 600; color: #8592a3; }\r
.tarea i { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #c7d0dc; font-style: normal; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; }\r
.tarea.activa { color: var(--tinta); }\r
.tarea.activa i { border-color: var(--amarillo); background: var(--amarillo); color: var(--tinta); animation: latido 1.2s infinite; }\r
.tarea.hecha { color: var(--tinta); }\r
.tarea.hecha i { border-color: var(--verde); background: var(--verde); color: #fff; }\r
.tarea.falla i { border-color: var(--rojo); background: var(--rojo); color: #fff; }\r
@keyframes latido { 50% { transform: scale(1.18); } }\r
.btn-tareas { display: none; }\r
\r
.acciones { position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; z-index: 12; }\r
.btn-stop { width: 112px; height: 112px; border-radius: 50%; border: 6px solid #fff; background: var(--rojo); color: #fff; font-weight: 900; font-size: 26px;\r
  box-shadow: 0 10px 30px rgba(229,72,77,.5); line-height: 1; transition: transform .1s; }\r
.btn-stop small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .08em; margin-top: 4px; opacity: .9; }\r
.btn-stop:active { transform: scale(.94); }\r
.btn-redondo { display: flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 10px 16px; background: rgba(0,38,74,.88); color: #fff; font-weight: 800; font-size: 13px; }\r
.btn-redondo kbd, .tecla { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; background: var(--amarillo); color: var(--tinta); font: 800 12px var(--fuente); }\r
.btn-redondo[disabled] { opacity: .5; }\r
\r
/* ---------- di\xE1logo ---------- */\r
.dialogo { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(760px, calc(100% - 300px)); z-index: 11;\r
  background: #fff; border-radius: 22px; padding: 18px 24px 16px; box-shadow: 0 16px 50px rgba(0,30,70,.3); display: flex; gap: 16px; align-items: flex-start; }\r
.avatar { flex: none; width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; color: var(--tinta); background: var(--amarillo); }\r
.avatar.monitora { background: var(--azul); color: #fff; }\r
.avatar.sistema { background: var(--marino); color: var(--amarillo); }\r
.dialogo .quien { font-size: 12px; font-weight: 800; letter-spacing: .12em; color: var(--azul); text-transform: uppercase; }\r
.dialogo .texto { font-size: 17px; line-height: 1.45; font-weight: 500; margin-top: 4px; }\r
.dialogo .texto b { color: var(--azul); }\r
.dialogo .pie { display: flex; justify-content: flex-end; margin-top: 10px; gap: 10px; }\r
.btn { border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 800; font-size: 15px; background: var(--azul); color: #fff; transition: transform .1s, background .2s; }\r
.btn:hover { background: #0a5fb0; } .btn:active { transform: scale(.97); }\r
.btn.amarillo { background: var(--amarillo); color: var(--tinta); } .btn.amarillo:hover { background: #ffe066; }\r
.btn.claro { background: var(--panel); color: var(--tinta); } .btn.claro:hover { background: #e2e8f1; }\r
.btn.rojo { background: var(--rojo); }\r
.btn[disabled] { opacity: .45; pointer-events: none; }\r
\r
/* ---------- toasts ---------- */\r
.toasts { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 30; pointer-events: none; }\r
.toast { padding: 10px 18px; border-radius: 999px; font-weight: 800; font-size: 15px; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: entra .3s ease-out, sale .4s ease-in 2.6s forwards; }\r
.toast.bien { background: var(--verde); } .toast.mal { background: var(--rojo); } .toast.info { background: var(--marino); }\r
@keyframes entra { from { transform: translateY(-14px); opacity: 0; } }\r
@keyframes sale { to { transform: translateY(-14px); opacity: 0; } }\r
\r
/* ---------- modal ---------- */\r
.velo { position: absolute; inset: 0; background: rgba(0,30,60,.55); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 20px; }\r
.modal { width: min(820px, 100%); max-height: calc(100vh - 40px); overflow: auto; background: #fff; border-radius: 26px; padding: 30px 34px; box-shadow: 0 30px 80px rgba(0,0,0,.35); animation: aparece .35s cubic-bezier(.2,1.3,.4,1); }\r
@keyframes aparece { from { transform: scale(.92); opacity: 0; } }\r
.kicker { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 12px; letter-spacing: .14em; color: var(--azul); text-transform: uppercase; }\r
.kicker::before { content: ''; width: 34px; height: 6px; border-radius: 3px; background: var(--amarillo); }\r
.modal h2 { margin: 10px 0 8px; font-size: 28px; font-weight: 900; line-height: 1.12; }\r
.modal p { font-size: 16px; line-height: 1.5; color: #3d4b5c; margin: 6px 0; }\r
.opciones { display: grid; gap: 10px; margin-top: 16px; }\r
.opcion { text-align: left; border: 2px solid #dfe5ee; background: #fff; border-radius: 16px; padding: 14px 18px; font-size: 16px; font-weight: 700; color: var(--tinta); display: flex; gap: 12px; align-items: center; transition: border-color .15s, background .15s, transform .1s; }\r
.opcion:hover { border-color: var(--azul); background: #f5f9ff; }\r
.opcion .letra { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--panel); display: flex; align-items: center; justify-content: center; font-weight: 900; color: var(--azul); }\r
.opcion.correcta { border-color: var(--verde); background: #e8f8ef; } .opcion.correcta .letra { background: var(--verde); color: #fff; }\r
.opcion.incorrecta { border-color: var(--rojo); background: #fdecec; } .opcion.incorrecta .letra { background: var(--rojo); color: #fff; }\r
.retro { margin-top: 14px; padding: 14px 18px; border-radius: 16px; background: var(--panel); font-size: 15px; line-height: 1.45; }\r
.retro small { display: block; margin-top: 6px; color: var(--azul); font-weight: 700; }\r
\r
/* EPP */\r
.epp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-top: 16px; }\r
.epp { border: 2px solid #dfe5ee; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; transition: border-color .2s, background .2s; }\r
.epp svg { width: 64px; height: 64px; }\r
.epp .nom { font-size: 13px; font-weight: 700; line-height: 1.25; min-height: 34px; }\r
.epp .estado { font-size: 12px; font-weight: 600; color: var(--gris); min-height: 30px; line-height: 1.25; }\r
.epp .botones { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }\r
.epp .botones .btn { padding: 8px 12px; font-size: 12px; }\r
.epp.puesto { border-color: var(--verde); background: #eefaf3; }\r
.epp.cambiado { border-color: var(--azul-medio); background: #eef4fb; }\r
.epp.defecto .estado { color: var(--rojo); }\r
.epp.bien .estado { color: var(--verde); }\r
\r
/* minijuegos */\r
.barra-tiempo { position: relative; height: 54px; border-radius: 27px; background: var(--panel); margin: 22px 0 10px; overflow: hidden; }\r
.barra-tiempo .zona { position: absolute; top: 0; bottom: 0; background: var(--verde); opacity: .85; }\r
.barra-tiempo .aguja { position: absolute; top: -4px; bottom: -4px; width: 8px; margin-left: -4px; border-radius: 4px; background: var(--tinta); box-shadow: 0 0 0 3px #fff; }\r
.deslizador { width: 100%; margin: 18px 0 6px; accent-color: var(--azul); height: 30px; }\r
.lectura { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }\r
.lectura .grande { font-size: 44px; font-weight: 900; color: var(--azul); font-variant-numeric: tabular-nums; }\r
.lectura .estado { font-weight: 800; font-size: 15px; padding: 6px 14px; border-radius: 999px; }\r
.estado.ok { background: #e8f8ef; color: #17844f; } .estado.no { background: #fdecec; color: #b8282d; }\r
.panel-flotante { position: absolute; right: 150px; bottom: 18px; width: 420px; z-index: 13; background: #fff; border-radius: 22px; padding: 20px 22px; box-shadow: 0 16px 50px rgba(0,30,70,.3); }\r
.panel-flotante h3 { margin: 6px 0 4px; font-size: 20px; font-weight: 900; }\r
.panel-flotante p { margin: 4px 0; font-size: 14px; color: #3d4b5c; line-height: 1.4; }\r
\r
/* escalada */\r
.escalada { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 13; background: #fff; border-radius: 22px; padding: 16px 22px; box-shadow: 0 16px 50px rgba(0,30,70,.3); display: flex; gap: 20px; align-items: center; }\r
.limbs { display: grid; grid-template-columns: repeat(4, 86px); gap: 10px; }\r
.limb { border: 3px solid #dfe5ee; border-radius: 16px; padding: 10px 6px; text-align: center; font-weight: 800; font-size: 12px; color: var(--gris); background: #fff; }\r
.limb .tecla { width: 38px; height: 38px; font-size: 18px; margin-bottom: 6px; background: var(--panel); }\r
.limb.siguiente { border-color: var(--amarillo); color: var(--tinta); transform: translateY(-4px); box-shadow: 0 8px 18px rgba(255,214,39,.5); }\r
.limb.siguiente .tecla { background: var(--amarillo); }\r
.limb.fallo { border-color: var(--rojo); animation: sacude .3s; }\r
@keyframes sacude { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }\r
.medidor { width: 26px; height: 170px; border-radius: 13px; background: var(--panel); position: relative; overflow: hidden; }\r
.medidor .z { position: absolute; left: 0; right: 0; }\r
.medidor .yo { position: absolute; left: -4px; right: -4px; height: 6px; background: var(--tinta); border-radius: 3px; transition: bottom .15s; }\r
.escalada .info { width: 210px; font-size: 13px; line-height: 1.4; color: #3d4b5c; }\r
.escalada .info b { display: block; font-size: 16px; color: var(--tinta); margin-bottom: 4px; }\r
\r
/* arn\xE9s */\r
.arnes-svg { width: 100%; max-width: 360px; display: block; margin: 10px auto; }\r
.arnes-svg .pt { cursor: pointer; }\r
.arnes-svg .pt circle { fill: #fff; stroke: var(--azul); stroke-width: 4; transition: fill .15s; }\r
.arnes-svg .pt:hover circle { fill: #ffe98a; }\r
.arnes-svg .pt.sel circle { fill: var(--amarillo); stroke: var(--tinta); }\r
.arnes-svg text { font: 700 13px var(--fuente); fill: var(--tinta); }\r
\r
/* reporte */\r
.estrellas { font-size: 46px; letter-spacing: 6px; color: #d7dde6; }\r
.estrellas b { color: var(--amarillo); text-shadow: 0 2px 0 #c9a400; }\r
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0; }\r
.stat { background: var(--panel); border-radius: 16px; padding: 14px; }\r
.stat label { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--gris); text-transform: uppercase; }\r
.stat div { font-size: 28px; font-weight: 900; color: var(--azul); }\r
.lista { margin: 6px 0 0; padding: 0; list-style: none; }\r
.lista li { padding: 8px 0 8px 30px; position: relative; font-size: 14px; line-height: 1.4; border-bottom: 1px solid #eef1f5; }\r
.lista li::before { position: absolute; left: 0; top: 7px; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #fff; }\r
.lista.bien li::before { content: '\u2713'; background: var(--verde); }\r
.lista.mal li::before { content: '!'; background: var(--rojo); }\r
.lista small { color: var(--azul); font-weight: 700; }\r
\r
/* inicio */\r
.inicio { position: absolute; inset: 0; z-index: 50; display: flex; align-items: center; background: linear-gradient(100deg, rgba(0,48,90,.96) 0%, rgba(0,78,150,.88) 55%, rgba(0,78,150,.25) 100%); color: #fff; padding: 0 6vw; overflow: hidden; }\r
.inicio .arco { position: absolute; right: -14vw; top: -22vh; width: 70vh; height: 70vh; border-radius: 50%; border: 9vh solid var(--amarillo); opacity: .95; }\r
.inicio .contenido { position: relative; max-width: 640px; }\r
.inicio .kicker { color: var(--amarillo); }\r
.inicio h1 { font-size: clamp(40px, 6vw, 76px); font-weight: 900; line-height: .98; margin: 14px 0 16px; letter-spacing: -.02em; }\r
.inicio h1 span { color: var(--amarillo); }\r
.inicio p { font-size: 18px; line-height: 1.5; color: #dce7f5; max-width: 560px; }\r
.inicio .botones { display: flex; gap: 12px; margin-top: 26px; flex-wrap: wrap; }\r
.inicio .btn { padding: 16px 28px; font-size: 17px; }\r
.controles { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 30px; font-size: 13px; color: #dce7f5; }\r
.controles span { display: flex; gap: 8px; align-items: center; }\r
.inicio img.logo { position: absolute; right: 5vw; bottom: 5vh; height: 54px; }\r
.cargando { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font: 800 18px var(--fuente); background: var(--marino); z-index: 60; }\r
\r
@media (max-width: 900px) {\r
  .tareas { display: none; }\r
  .dialogo { width: calc(100% - 150px); left: 14px; transform: none; padding: 14px 16px; }\r
  .dialogo .texto { font-size: 15px; }\r
  .panel-flotante { right: 14px; left: 14px; width: auto; bottom: 140px; }\r
  .limbs { grid-template-columns: repeat(4, 64px); }\r
  .escalada .info { display: none; }\r
  .btn-stop { width: 92px; height: 92px; font-size: 21px; }\r
  .ind { min-width: 84px; } .ind .v { font-size: 17px; }\r
}\r
\r
/* =====================================================================\r
   Versi\xF3n 2: objetivo en pantalla, pista, escalada \u25B2\u25BC, minijuegos del manual\r
   ===================================================================== */\r
.objetivo { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 9; max-width: min(620px, calc(100% - 700px)); min-width: 300px;\r
  background: rgba(255,255,255,.95); border-radius: 18px; padding: 10px 18px 11px; box-shadow: 0 10px 30px rgba(0,30,70,.25); border-left: 8px solid var(--amarillo);\r
  animation: objIn .5s ease-out; pointer-events: none; margin-top: 78px; }\r
.objetivo .obj-cab { display: flex; gap: 10px; align-items: baseline; }\r
.objetivo .obj-cab b { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--azul); }\r
.objetivo .obj-cab span { font-weight: 900; font-size: 16px; color: var(--tinta); }\r
.objetivo .obj-txt { font-size: 14px; line-height: 1.35; font-weight: 600; color: #34465c; margin-top: 3px; }\r
.objetivo .obj-dato { margin-top: 6px; font-size: 12px; line-height: 1.35; color: var(--azul); font-weight: 600; background: #eef4fb; border-radius: 10px; padding: 5px 10px; animation: fadeDato 1s 12s forwards; }\r
@keyframes objIn { from { transform: translate(-50%, -14px); opacity: 0; } }\r
@keyframes fadeDato { to { opacity: 0; max-height: 0; padding: 0; margin: 0; } }\r
.fila-peq { display: flex; gap: 8px; }\r
.toast.pista { background: #fff; color: var(--tinta); border: 3px solid var(--amarillo); max-width: 640px; text-align: center; border-radius: 18px; line-height: 1.35; }\r
\r
/* escalada con \u25B2 \u25BC */\r
.escalada { gap: 18px; padding: 14px 20px; max-width: calc(100% - 20px); }\r
.esc-centro { display: flex; flex-direction: column; gap: 6px; align-items: center; }\r
.limbs { grid-template-columns: repeat(4, 74px) !important; gap: 8px !important; }\r
.limb { padding: 6px 4px !important; font-size: 11px !important; }\r
.limb .ico { font-size: 24px; line-height: 1; margin-bottom: 4px; filter: grayscale(.6); }\r
.limb.apoyo { border-color: var(--verde) !important; color: #17844f !important; background: #eefaf3; }\r
.limb.mueve { border-color: var(--amarillo) !important; color: var(--tinta) !important; background: #fff7d1; transform: translateY(-5px); box-shadow: 0 8px 18px rgba(255,214,39,.55); }\r
.limb.mueve .ico { filter: none; }\r
.esc-estado { font-size: 12px; font-weight: 800; color: #17844f; }\r
.esc-estado.mal { color: var(--rojo); }\r
.ctrl-esc { display: flex; flex-direction: column; gap: 8px; }\r
.btn-esc { display: flex; align-items: center; gap: 10px; border: 0; border-radius: 16px; padding: 10px 18px; font-weight: 900; font-size: 15px; background: var(--azul); color: #fff; touch-action: none; min-width: 142px; }\r
.btn-esc span { font-size: 20px; } .btn-esc small { margin-left: auto; font-size: 10px; opacity: .75; font-weight: 700; }\r
.btn-esc.bajar { background: var(--marino); } .btn-esc:active { transform: scale(.96); background: var(--amarillo); color: var(--tinta); }\r
.escalada .info .zv { font-style: normal; color: #17844f; font-weight: 800; }\r
.escalada .info u { text-decoration: none; color: var(--azul); font-weight: 800; }\r
\r
/* deslizadores m\xFAltiples */\r
.ctl { margin-top: 10px; }\r
.etq-ctl { font-size: 13px; font-weight: 700; color: var(--gris); }\r
.ctl .grande { font-size: 30px !important; }\r
.visual-slot:empty { display: none; }\r
.visual-slot { margin: 8px 0 2px; }\r
.visual-slot svg { width: 100%; max-height: 120px; }\r
.panel-flotante p b { color: var(--azul); }\r
\r
/* minijuego de fibras */\r
.fibras-sup { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 12px; }\r
.turno { font-size: 20px; font-weight: 700; } .turno b { font-size: 34px; color: var(--azul); font-weight: 900; margin-left: 4px; }\r
.chuleta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; font-weight: 700; color: var(--gris); max-width: 460px; }\r
.chuleta span { display: inline-flex; gap: 5px; align-items: center; background: var(--panel); border-radius: 999px; padding: 3px 10px 3px 4px; }\r
.chuleta i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid #0003; display: inline-block; }\r
.tubo { display: flex; gap: 14px; justify-content: center; padding: 22px 10px; margin: 14px 0 8px; border-radius: 999px; background: linear-gradient(#e9eef5, #d3dce8); box-shadow: inset 0 6px 14px rgba(0,30,70,.15); }\r
.fibra { width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--c); cursor: pointer; box-shadow: 0 6px 12px rgba(0,0,0,.28), inset 0 -6px 10px rgba(0,0,0,.2), inset 0 6px 8px rgba(255,255,255,.35); transition: transform .12s; }\r
.fibra:hover { transform: scale(1.12); } .fibra i { display: block; width: 18px; height: 18px; margin: 0 auto; border-radius: 50%; background: rgba(255,255,255,.55); transform: translate(-8px, -8px); }\r
.fibra.hecha { opacity: .25; transform: scale(.8); pointer-events: none; }\r
.fibra.sacude { animation: sacude .35s; }\r
.fila-empalmes { display: flex; gap: 8px; min-height: 40px; align-items: center; justify-content: center; }\r
.emp { width: 34px; height: 34px; border-radius: 50%; background: var(--c); display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: #fff; text-shadow: 0 1px 2px #000a; box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--verde); }\r
\r
/* selecci\xF3n m\xFAltiple */\r
.opcion.check .letra { font-size: 18px; background: transparent; }\r
.opcion.check.sel { border-color: var(--azul); background: #eef4fb; }\r
\r
/* insignias */\r
.insignias { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 14px; }\r
.insignia-ch { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(#fff7d1, #ffe98a); color: var(--tinta); font-weight: 800; font-size: 13px; padding: 7px 14px 7px 8px; border-radius: 999px; box-shadow: 0 4px 10px rgba(255,190,0,.35); animation: aparece .5s cubic-bezier(.2,1.4,.4,1) backwards; }\r
.insignia-ch b { width: 26px; height: 26px; border-radius: 50%; background: var(--amarillo); display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }\r
\r
/* inicio: dificultad */\r
.dif { display: flex; gap: 10px; align-items: center; margin-top: 22px; flex-wrap: wrap; }\r
.dif > span { font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--amarillo); margin-right: 4px; }\r
.chip-dif { border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); color: #fff; border-radius: 16px; padding: 10px 16px; font-weight: 800; font-size: 15px; text-align: left; }\r
.chip-dif small { display: block; font-weight: 500; font-size: 11px; opacity: .8; margin-top: 2px; }\r
.chip-dif.sel { border-color: var(--amarillo); background: rgba(255,214,39,.18); }\r
\r
@media (max-width: 1100px) { .objetivo { max-width: calc(100% - 28px); min-width: 0; margin-top: 74px; left: 14px; transform: none; } .escalada .info { display: none; } }\r
@media (max-width: 900px) { .limbs { grid-template-columns: repeat(4, 58px) !important; } .btn-esc { min-width: 112px; padding: 8px 12px; } }\r
.chip-color { display: inline-block; width: 26px; height: 26px; border-radius: 8px; margin-right: 6px; vertical-align: middle; box-shadow: inset 0 0 0 2px rgba(0,0,0,.18); }\r
.opcion small { font-weight: 600; color: var(--gris); margin-left: 4px; }\r
\r
/* =====================================================================\r
   Versi\xF3n 3: zonas sin solapes (dock, carril de avisos), m\xF3vil y QR\r
   ===================================================================== */\r
:root { --sa-t: env(safe-area-inset-top, 0px); --sa-r: env(safe-area-inset-right, 0px); --sa-b: env(safe-area-inset-bottom, 0px); --sa-l: env(safe-area-inset-left, 0px); }\r
#juego { height: 100%; height: 100dvh; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }\r
.hud-sup { top: calc(14px + var(--sa-t)); left: calc(14px + var(--sa-l)); right: calc(14px + var(--sa-r)); }\r
.acciones { right: calc(16px + var(--sa-r)); bottom: calc(16px + var(--sa-b)); }\r
\r
/* lista de tareas: su posici\xF3n la calcula layout.js */\r
.tareas { top: var(--tareas-top, 104px); left: calc(14px + var(--sa-l)); max-height: var(--tareas-max, 70vh); overflow: auto; overscroll-behavior: contain; }\r
.btn-tareas { display: none; pointer-events: auto; border: 0; font: 800 14px var(--fuente); cursor: pointer; align-self: center; }\r
.btn-tareas b { color: var(--amarillo); }\r
\r
/* dock inferior: di\xE1logo, paneles y escalada se apilan, nunca se tapan */\r
.dock { position: absolute; left: calc(var(--dock-izq, 14px) + var(--sa-l)); right: calc(var(--dock-der, 160px) + var(--sa-r)); bottom: calc(14px + var(--sa-b));\r
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; z-index: 13; pointer-events: none;\r
  max-height: var(--dock-max, 60%); }\r
.dock > * { min-height: 0; flex-shrink: 1; pointer-events: auto; position: relative !important; left: auto !important; right: auto !important; bottom: auto !important; top: auto !important; transform: none !important; max-width: 100%; flex: 0 1 auto; }\r
.dock > .dialogo { width: min(760px, 100%); overflow: auto; }\r
.dock > .panel-flotante { width: min(460px, 100%); max-height: 100%; overflow: auto; }\r
.dock > .escalada { max-width: 100%; }\r
.fila-accion { display: flex; justify-content: space-between; align-items: center; gap: 12px; }\r
.ayuda-ctl { font-size: 12.5px; color: var(--gris); margin: 4px 0 0; line-height: 1.35; }\r
.btn-mantener { touch-action: none; -webkit-touch-callout: none; }\r
\r
/* carril de avisos: bajo el objetivo; con un modal abierto sube sobre el velo */\r
.toasts { top: var(--toast-top, 96px); left: calc(14px + var(--sa-l)); right: calc(14px + var(--sa-r)); transform: none; }\r
.toast { max-width: min(680px, 100%); animation-name: entraSuave, sale; }\r
@keyframes entraSuave { from { transform: translateY(-6px); opacity: 0; } }\r
@keyframes sale { to { transform: translateY(-4px); opacity: 0; } }\r
.toast { line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }\r
.con-modal .toasts { top: calc(10px + var(--sa-t)); z-index: 45; }\r
.con-modal .toast { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100vw - 40px); }\r
.con-modal .velo { padding-top: calc(66px + var(--sa-t)); }\r
.velo .modal { max-height: calc(100% - 4px); overscroll-behavior: contain; }\r
\r
/* objetivo: centrado entre la lista y los indicadores; en compacto, a todo el ancho bajo el HUD */\r
.objetivo { max-width: min(620px, calc(100% - 640px)); top: calc(var(--hud-h, 84px) + 8px); margin-top: 0; animation-name: objFade; }\r
@keyframes objFade { from { opacity: 0; } }\r
\r
/* ---------- modo compacto (tabletas, port\xE1tiles peque\xF1os, tel\xE9fonos en horizontal) ---------- */\r
.compacto .btn-tareas { display: block; }\r
.compacto .tareas { display: none; }\r
.compacto .tareas.abierta { display: block; z-index: 25; box-shadow: 0 20px 60px rgba(0,30,70,.4); }\r
.compacto .objetivo { left: calc(14px + var(--sa-l)); right: calc(14px + var(--sa-r)); transform: none; max-width: none; min-width: 0; margin-top: 0; top: calc(var(--hud-h, 74px) + 8px); animation: none; }\r
.compacto .objetivo .obj-dato { display: none; }\r
\r
/* ---------- pantallas bajas (tel\xE9fono en horizontal) ---------- */\r
.bajo .chip { padding: 6px 11px; border-radius: 12px; }\r
.bajo .jornada b { font-size: 10px; } .bajo .jornada span { font-size: 13px; } .bajo .jornada small { display: none; }\r
.bajo .ind { min-width: 70px; } .bajo .ind label { font-size: 9px; } .bajo .ind .v { font-size: 15px; } .bajo .barra-seg { height: 5px; margin-top: 3px; }\r
.bajo .btn-tareas { font-size: 12px; padding: 6px 11px; }\r
.bajo .objetivo { padding: 6px 12px; border-left-width: 6px; border-radius: 12px; }\r
.bajo .objetivo .obj-cab span { font-size: 13px; } .bajo .objetivo .obj-cab b { font-size: 9px; }\r
.bajo .objetivo .obj-txt { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\r
.bajo .acciones { gap: 6px; right: calc(10px + var(--sa-r)); bottom: calc(10px + var(--sa-b)); }\r
.bajo .btn-stop { width: 74px; height: 74px; font-size: 18px; border-width: 4px; } .bajo .btn-stop small { font-size: 7px; }\r
.bajo .btn-redondo { padding: 7px 11px; font-size: 11px; } .bajo .btn-redondo kbd { display: none; }\r
.bajo .dock { bottom: calc(8px + var(--sa-b)); gap: 6px; }\r
.bajo .dialogo { padding: 9px 14px 9px; border-radius: 16px; gap: 10px; }\r
.bajo .dialogo .avatar { width: 34px; height: 34px; font-size: 15px; }\r
.bajo .dialogo .quien { font-size: 10px; } .bajo .dialogo .texto { font-size: 13px; line-height: 1.35; margin-top: 2px; }\r
.bajo .dialogo .pie { margin-top: 6px; } .bajo .btn { padding: 9px 16px; font-size: 13px; }\r
.bajo .panel-flotante { padding: 12px 14px; border-radius: 16px; } .bajo .panel-flotante h3 { font-size: 15px; margin: 2px 0; } .bajo .panel-flotante p { font-size: 12px; }\r
.bajo .panel-flotante .kicker { font-size: 10px; } .bajo .lectura .grande, .bajo .ctl .grande { font-size: 22px !important; } .bajo .deslizador { margin: 8px 0 2px; }\r
.bajo .barra-tiempo { height: 40px; margin: 10px 0 8px; }\r
.bajo .escalada { padding: 8px 12px; gap: 10px; } .bajo .medidor { height: 96px; width: 18px; }\r
.bajo .limbs { grid-template-columns: repeat(4, 50px) !important; gap: 5px !important; } .bajo .limb { font-size: 9px !important; } .bajo .limb .ico { font-size: 17px; }\r
.bajo .velo { padding: 8px; } .bajo.con-modal .velo { padding-top: calc(50px + var(--sa-t)); }\r
.bajo .modal { padding: 16px 20px; border-radius: 18px; }\r
.bajo .modal h2 { font-size: 19px; margin: 6px 0; } .bajo .modal p { font-size: 13px; margin: 4px 0; } .bajo .kicker { font-size: 10px; }\r
.bajo .opciones { gap: 6px; margin-top: 10px; } .bajo .opcion { padding: 8px 12px; font-size: 13.5px; border-radius: 12px; } .bajo .opcion .letra { width: 24px; height: 24px; }\r
.bajo .retro { padding: 9px 12px; font-size: 13px; margin-top: 8px; }\r
.bajo .epp-grid { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; } .bajo .epp { padding: 8px; gap: 4px; border-radius: 14px; }\r
.bajo .epp svg { width: 40px; height: 40px; } .bajo .epp .nom { font-size: 11.5px; min-height: 0; } .bajo .epp .estado { font-size: 10.5px; min-height: 0; }\r
.bajo .stats { gap: 8px; margin: 10px 0; } .bajo .stat { padding: 8px 10px; } .bajo .stat div { font-size: 20px; } .bajo .estrellas { font-size: 32px; }\r
.bajo .toast { font-size: 13px; padding: 7px 14px; }\r
.bajo .etq3d { font-size: 12px; padding: 5px 11px; }\r
\r
/* ---------- t\xE1ctil: objetivos de al menos 44 px ---------- */\r
.tactil .btn, .tactil .btn-redondo, .tactil .opcion, .tactil .btn-esc { min-height: 44px; }\r
.tactil .btn-grande { min-height: 52px; min-width: 120px; font-size: 16px; }\r
.tactil .btn-esc { min-width: 124px; min-height: 58px; font-size: 16px; } .tactil .btn-esc small { display: none; }\r
.tactil.bajo .btn-esc { min-height: 50px; min-width: 104px; }\r
.tactil .etq3d.clic { padding: 9px 16px; }\r
.tactil .deslizador { height: 44px; }\r
\r
/* ---------- inicio: QR para el m\xF3vil ---------- */\r
.qr-movil { position: absolute; right: 5vw; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px; width: 250px;\r
  background: #fff; color: var(--tinta); border-radius: 22px; padding: 18px 18px 16px; box-shadow: 0 20px 60px rgba(0,0,0,.35); text-align: center; z-index: 2; }\r
.qr-movil svg { width: 196px; height: 196px; display: block; }\r
.qr-movil b { display: block; font-size: 15px; font-weight: 900; } .qr-movil span { display: block; font-size: 12px; color: var(--gris); margin-top: 4px; line-height: 1.35; }\r
.qr-movil small { display: block; margin-top: 6px; font-size: 11px; font-weight: 700; color: var(--azul); word-break: break-all; }\r
@media (max-width: 1180px) { .qr-movil { display: none; } }\r
.qr-final { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 16px; font-size: 13px; color: var(--gris); }\r
.qr-final svg { width: 92px; height: 92px; border-radius: 8px; box-shadow: 0 0 0 1px #e3e9f2; }\r
.consejo-ios { margin-top: 14px; font-size: 13px; color: #dce7f5; background: rgba(255,255,255,.1); border-radius: 12px; padding: 8px 12px; display: inline-block; }\r
.bajo .inicio { padding: 0 5vw; } .bajo .inicio h1 { font-size: 34px; margin: 6px 0 8px; } .bajo .inicio p { font-size: 13px; }\r
.bajo .inicio .dif { margin-top: 10px; } .bajo .chip-dif { padding: 6px 10px; font-size: 13px; } .bajo .inicio .botones { margin-top: 12px; }\r
.bajo .inicio .btn { padding: 11px 20px; font-size: 15px; } .bajo .controles { margin-top: 12px; font-size: 11px; gap: 10px; } .bajo .inicio img.logo { height: 36px; bottom: 3vh; }\r
\r
/* ---------- aviso "gira tu tel\xE9fono" ---------- */\r
.girar { position: fixed; inset: 0; z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 30px;\r
  background: radial-gradient(circle at 50% 35%, #0A5FB0 0%, var(--marino) 70%); color: #fff; font-family: var(--fuente); }\r
.girar.visible { display: flex; }\r
.girar b { font-size: 22px; font-weight: 900; } .girar span { font-size: 14px; opacity: .85; }\r
.girar-ico { width: 110px; height: 110px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }\r
.girar .tel { width: 46px; height: 82px; border: 5px solid var(--amarillo); border-radius: 10px; position: relative; animation: girarTel 2.2s ease-in-out infinite; }\r
.girar .tel::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 10px; height: 3px; margin-left: -5px; border-radius: 2px; background: var(--amarillo); }\r
@keyframes girarTel { 0%, 20% { transform: rotate(0); } 55%, 80% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }\r
\r
/* pregunta sorpresa: barra de tiempo */\r
.reloj-preg { height: 8px; border-radius: 4px; background: var(--panel); overflow: hidden; margin: 6px 0 2px; }\r
.reloj-preg i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--rojo), var(--amarillo)); transform-origin: left; animation: vaciar linear forwards; }\r
.reloj-preg.parado i { animation-play-state: paused; }\r
@keyframes vaciar { to { transform: scaleX(0); } }\r
\r
.etq3d.lado-der::before, .etq3d.lado-izq::after { content: ''; position: absolute; top: 50%; width: 26px; height: 2px; background: var(--amarillo); }\r
.etq3d.lado-der::before { right: 100%; } .etq3d.lado-izq::after { left: 100%; }\r
